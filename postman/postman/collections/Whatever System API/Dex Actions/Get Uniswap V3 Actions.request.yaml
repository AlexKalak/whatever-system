$kind: http-request
url: "{{baseUrl}}/dex-actions/uniswap-v3?page={{page}}&limit={{limit}}&orderBy={{dexActionOrderBy}}&direction={{dexActionDirection}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.expect(json.items).to.be.an('array');
      pm.expect(json.orderBy).to.exist;
      pm.expect(json.direction).to.exist;
      if (json.items.length > 0) {
        pm.collectionVariables.set('dexActionV3Id', json.items[0].id);
      }
    language: text/javascript
order: 3000
