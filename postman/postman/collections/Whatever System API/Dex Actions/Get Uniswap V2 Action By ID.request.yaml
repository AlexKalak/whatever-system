$kind: http-request
url: "{{baseUrl}}/dex-actions/uniswap-v2/{{dexActionV2Id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 or 400/404 when no seeded id exists', function () {
        pm.expect([200, 400, 404]).to.include(pm.response.code);
      });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.expect(json.id).to.exist;
        pm.expect(json.indexInBlock).to.exist;
        pm.expect(json.indexInTx).to.exist;
      }
    language: text/javascript
order: 2100
