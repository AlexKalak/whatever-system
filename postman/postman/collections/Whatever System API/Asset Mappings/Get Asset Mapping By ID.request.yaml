$kind: http-request
url: "{{baseUrl}}/asset-mappings/{{mappingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.expect(json.id).to.eql(pm.collectionVariables.get('mappingId'));
    language: text/javascript
order: 3000
