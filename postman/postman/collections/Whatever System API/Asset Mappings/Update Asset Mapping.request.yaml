$kind: http-request
url: "{{baseUrl}}/asset-mappings/{{mappingId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "type": "onchain",
      "name": "BTC Mainnet Updated",
      "exchange": "",
      "symbolOnExchange": "",
      "chainID": 1,
      "address": "0xabcdefabcdefabcdefabcdefabcdefabcdefabcd",
      "decimals": 8
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.expect(json.name).to.eql('BTC Mainnet Updated');
    language: text/javascript
order: 4000
